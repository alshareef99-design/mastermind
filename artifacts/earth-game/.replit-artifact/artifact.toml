kind = "web"
previewPath = "/"
title = "Earth Geography Game"
version = "1.0.0"
id = "artifacts/earth-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25838

[services.development]
run = "pnpm --filter @workspace/earth-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/earth-game", "run", "build" ]
publicDir = "artifacts/earth-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25838"
BASE_PATH = "/"
